[package]
name = "postern-perps-oracle-core"
description = "PosternDEX Perpetuals oracle: deterministic acceptance, halt and aggregation rules (UNAUDITED PROTOTYPE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "perps_oracle"

[dependencies]
