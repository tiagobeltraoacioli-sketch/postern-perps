[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
# The Bloch L2 executes CANCUN; shanghai is the subset the bridge's L2 token is built for (no transient storage,
# no MCOPY), so this vault runs on either.
evm_version = "shanghai"
optimizer = true
# Measured, not assumed: creation must stay far below the L2's per-transaction gas cap (see docs/VAULT.md, "Gas").
optimizer_runs = 1
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[profile.default.fuzz]
runs = 512
seed = "0x7b10ca"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
show_metrics = true
